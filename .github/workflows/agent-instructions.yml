name: Agent instructions

on:
  pull_request:

jobs:
  # Run unconditionally: the guard owns both canonical sx shape and tracked
  # fail-open/manifest drift, including instruction-only PRs. Keep the legacy job
  # id because branch protection already requires this check name.
  generated-files-match-sources:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Agent instructions guard
        run: node ops/canonical-sx-drift-check.mjs
