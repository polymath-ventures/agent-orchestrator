name: Agent instructions

on:
  pull_request:

jobs:
  generated-files-match-sources:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Agent instructions guard
        run: node ops/canonical-sx-drift-check.mjs
