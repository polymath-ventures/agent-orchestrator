name: Canonical sx drift

on:
  pull_request:

jobs:
  canonical-sx-shape:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Canonical sx drift guard
        run: node ops/canonical-sx-drift-check.mjs
