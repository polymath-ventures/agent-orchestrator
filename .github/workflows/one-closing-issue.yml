# @sx-managed: polypowers-init-one-closing-issue
name: One closing issue

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  issues: read
  pull-requests: read
  statuses: write

concurrency:
  group: one-closing-issue-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  publish-status:
    name: Publish one-closing-issue status
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted default-branch policy
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Evaluate pull request linkage
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/one-closing-issue.cjs
